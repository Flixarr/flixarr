version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      web:
        patterns: ["*"]
    ignore:
      # SvelteKit only supports TypeScript 6 so far
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies]
